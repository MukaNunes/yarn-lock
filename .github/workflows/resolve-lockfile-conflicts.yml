name: Resolve lockfile conflicts

# Roda em PRs do mesmo repositório (não em forks — GITHUB_TOKEN não tem permissão
# de push em branches de fork). Quando o branch da PR fica desatualizado em
# relação ao branch base e o conflito resultante se resume a package.json e/ou
# yarn.lock, este workflow resolve automaticamente e faz push da resolução de
# volta para a branch da PR. Se houver conflito em qualquer outro arquivo, o
# workflow falha propositalmente e não mexe em nada — resolução manual.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: resolve-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Atualiza Corepack (evita falha conhecida de verificação de assinatura)
        run: npm install --global corepack@latest

      - name: Configura identidade do bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Busca branch base
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - name: Resolve conflitos restritos a package.json/yarn.lock
        id: resolve
        run: |
          chmod +x scripts/resolve-lockfile-conflict.sh
          set +e
          scripts/resolve-lockfile-conflict.sh "origin/${{ github.event.pull_request.base.ref }}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Push da resolução
        if: steps.resolve.outcome == 'success'
        run: git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Comenta na PR — conflito fora do escopo (requer resolução manual)
        if: steps.resolve.outputs.code == '10'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ Este branch tem conflitos com `${{ github.event.pull_request.base.ref }}` que vão além de `package.json`/`yarn.lock`. Resolução automática não aplicada — é necessário resolver manualmente."
            })

      - name: Comenta na PR — falha inesperada na resolução automática
        if: failure() && steps.resolve.outputs.code != '10'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "❌ A resolução automática de `package.json`/`yarn.lock` falhou de forma inesperada (não foi um conflito em outros arquivos). Veja o log do job para detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            })
